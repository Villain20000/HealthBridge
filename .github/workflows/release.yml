name: Release

# Manual dispatch ONLY: this workflow never runs on push or pull_request.
# It builds, fully tests and packs every workspace into dist/ tarballs that
# are uploaded as workflow artifacts. There is deliberately NO registry
# publish step here: publishing stays "only with explicit authorisation"
# (ROADMAP Phase F), so a release tag or a maintainer must trigger a
# separate, explicitly authorised publish.
on:
  workflow_dispatch:
    inputs:
      label:
        description: "Label for the release artifacts (e.g. the version being packaged)"
        required: false
        default: "manual"

permissions:
  contents: read

concurrency:
  group: release-manual
  cancel-in-progress: false

jobs:
  package:
    name: Build, test and pack workspaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Typecheck and build
        run: npm run build

      - name: Full test suite
        run: npm test

      - name: Docs site builds deterministically
        run: |
          npm run docs:site -- --out /tmp/docs-site-a
          npm run docs:site -- --out /tmp/docs-site-b
          diff -r /tmp/docs-site-a /tmp/docs-site-b
          test -s /tmp/docs-site-a/index.html

      - name: Verify publishable tarballs (packaging gate)
        run: node scripts/check-pack.mjs

      - name: Pack every workspace into dist/
        run: npm run release:pack

      - name: List packed tarballs
        run: ls -la dist/*.tgz

      - name: Upload release tarballs
        uses: actions/upload-artifact@v4
        with:
          name: release-tarballs-${{ inputs.label }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 30
